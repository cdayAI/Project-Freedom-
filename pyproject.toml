[project]
name = "alpha-forge"
version = "0.1.0"
description = "ALPHA FORGE: perpetual compounding engine — autonomous strategy research platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alpha_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
